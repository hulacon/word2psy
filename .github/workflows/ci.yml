# word2psy's first CI, and the carve the CLAUDE.md TODO asked for
# ("add a slow/integration pytest marker ... so a genuinely offline unit suite
# exists").
#
# That TODO paired the marker with "lightweight fake models". Only the marker
# half is done here — it turned out to be enough. The measured split:
#
#   177 tests need no weights at all
#    46 tests download something large (fastText ~7 GB, CLIP, CLAP, GPT-2, two
#       RoBERTas, MiniLM, seven norm databases) and carry the `weights` marker
#
# CLAUDE.md said only `test_tokenize` and `test_viz` were "truly offline". That
# was already out of date in the pessimistic direction: with two small nltk
# corpora present, thirteen of the nineteen test files pass end to end. Fakes
# would now buy only the last 46, at the cost of the tests being fake — a much
# worse trade than it looked before the split was measured.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly. Every bound floats (`torch>=2.0`, `transformers>=4.40`,
  # `gensim>=4.3.3`, ...) and this repo's dependency surface is the widest in
  # the family, so an upstream release can turn main red with the repo
  # unchanged. Without a scheduled run that lands on whoever pushes next and
  # reads as theirs.
  #
  # Monday 15:47 UTC — start of the working week in Eugene, off the hour,
  # offset from the sibling repos so the family does not queue against itself.
  #
  # Caveats: a scheduled failure is reported against the last commit on main,
  # which did not cause it. And **GitHub disables a scheduled workflow in a
  # public repo after 60 days with no repository activity** — a quiet period
  # switches this off silently; re-enable from the Actions tab.
  schedule:
    - cron: "47 15 * * 1"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The declared range is `>=3.11,<3.13`, so these are its exact ends.
      # Neither bound is caution. The ceiling is `fasttext-wheel`, which has no
      # 3.13 wheel and does not build there (CLAUDE.md). The floor is
      # scikit-learn: 1.8+ requires Python >=3.11, so a 3.10 leg would resolve
      # sklearn 1.7.x forever and test a dependency set nobody runs. Raising
      # either is a dependency problem, not a matrix edit.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # torch FIRST, from the CPU index, so that by the time `-e ".[dev]"`
        # resolves `torch>=2.0` (directly, and again through open-clip-torch and
        # sentence-transformers) the requirement is already satisfied and pip
        # does not reach for the CUDA build. Plain `pip install torch` on linux
        # pulls the nvidia-* wheels: measured elsewhere in this family at 5-6 GB
        # installed, on machines with no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: NLTK data
        # punkt and cmudict, and deliberately nothing else. These are the only
        # downloads the default suite needs, they are ~35 MB together, and they
        # are the difference between 97 and 177 passing tests — tokenization
        # underpins most of the suite, and cmudict is what `wordform`'s phoneme
        # counts and OLD20 read.
        #
        # They are NOT `weights` for that reason: the marker means "large model
        # download", and pretending a 35 MB corpus belongs in the same tier
        # would have cut 80 real tests out of the gate to save nothing.
        run: |
          python -m nltk.downloader punkt punkt_tab cmudict

      - name: Import check
        # Cheap, and it covers what the suite structurally cannot: cli.py
        # imports models lazily from MODEL_REGISTRY to keep `--help` fast, so a
        # syntax error in a model module no test touches ships green.
        #
        # Deliberately not bare `python -m compileall -q src/`: that prints
        # "Can't list 'src/'" and **exits 0** when the path is wrong, so the day
        # the layout moves the step keeps passing while checking nothing.
        run: |
          python -c "import word2psy; print('word2psy', word2psy.__version__)"
          python - <<'PY'
          import compileall, pathlib, sys

          models = sorted(pathlib.Path("src/word2psy/models").glob("*.py"))
          if len(models) < 8:
              sys.exit(f"only {len(models)} model modules under src/word2psy/models — layout moved?")
          print(f"compiling {len(models)} model modules + package")
          sys.exit(0 if compileall.compile_dir("src", quiet=1) else 1)
          PY

      - name: Model registry is importable
        # The registry is lazy by design — that is what keeps `--help` fast. The
        # cost is that a renamed class or moved module stays invisible until
        # somebody asks for that model, which no test in the default tier does
        # for most of them. Resolving every entry turns that into a gate.
        #
        # Importing a model module does NOT download its weights (that happens
        # in load()), so this is cheap and stays in the default tier. An
        # ImportError naming a word2psy module is a registry typo and is fatal;
        # a missing third-party backend (the `ebind` extra is not installed
        # here) is expected and only reported.
        run: |
          python - <<'PY'
          import importlib

          from word2psy.cli import MODEL_REGISTRY

          missing = []
          for name, entry in MODEL_REGISTRY.items():
              module_path, class_name = entry[0], entry[1]
              try:
                  cls = getattr(importlib.import_module(module_path), class_name)
              except ImportError as e:
                  if (getattr(e, "name", "") or "").startswith("word2psy"):
                      raise SystemExit(f"registry entry {name!r} points at a module that does not exist: {e}")
                  missing.append(f"{name}: {e}")
              except AttributeError as e:
                  raise SystemExit(f"registry entry {name!r} names a class that does not exist: {e}")
              else:
                  print(f"  {name} -> {cls.__name__}")
          if missing:
              print("\nnot resolvable without the optional extras (expected):")
              for m in missing:
                  print(f"  {m}")
          PY

      - name: Tests
        # Bare `pytest`, deliberately. `addopts` in pyproject already carries
        # `-m 'not weights' --strict-markers`, and a `-m` passed on the command
        # line **replaces** it rather than adding to it — spelling the selection
        # here would be one more place for it to drift.
        #
        # Measured 2026-08-30: 177 passed, 46 deselected, ~66 s.
        run: pytest -q -rs
