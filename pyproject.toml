[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "word2psy"
version = "0.5.0"
description = "Extract psychological and linguistic features from text using multiple computational models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Ben Hutchinson", email = "bhutch@uoregon.edu"},
]
keywords = [
    "text features",
    "psycholinguistics",
    "lexical norms",
    "NLP",
    "psychology",
    "cognitive neuroscience",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.0",
    "open-clip-torch>=2.24",
    "transformers>=4.40",
    "gensim>=4.3.3",
    "sentence-transformers>=3.0",
    "textstat>=0.7",
    "rapidfuzz>=3.0",
    "fasttext-wheel>=0.9.2",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "numpy>=1.24",
    "nltk>=3.8",
    "wordfreq>=3.0",
    "tqdm>=4.60",
    "joblib>=1.3",
    "pyarrow>=12.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]
ebind = ["ebind @ git+https://github.com/encord-team/ebind"]

[project.scripts]
word2psy = "word2psy.cli:main"

[project.urls]
Homepage = "https://github.com/hulacon/word2psy"
Repository = "https://github.com/hulacon/word2psy"
Issues = "https://github.com/hulacon/word2psy/issues"

[tool.setuptools.packages.find]
where = ["src"]
