[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "word2psy"
version = "0.10.0"
description = "Extract psychological and linguistic features from text using multiple computational models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Ben Hutchinson", email = "bhutch@uoregon.edu"},
]
keywords = [
    "text features",
    "psycholinguistics",
    "lexical norms",
    "NLP",
    "psychology",
    "cognitive neuroscience",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.0",
    "open-clip-torch>=2.24",
    "transformers>=4.40",
    "gensim>=4.3.3",
    "sentence-transformers>=3.0",
    "textstat>=0.7",
    "rapidfuzz>=3.0",
    "fasttext-wheel>=0.9.2",
    # >=1.8 is where MDS gained `metric_mds` and `init`, which viz/projection.py
    # calls directly. It is also unreachable below Python 3.11, which is what
    # sets the floor above.
    "scikit-learn>=1.8",
    "pandas>=1.5",
    "numpy>=1.24",
    "nltk>=3.8",
    "wordfreq>=3.0",
    "tqdm>=4.60",
    "joblib>=1.3",
    "pyarrow>=12.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]
ebind = ["ebind @ git+https://github.com/encord-team/ebind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The offline unit suite the CLAUDE.md TODO asked for. `weights` marks every
# test that downloads model weights or norm databases at test time -- fastText
# (~7 GB), CLIP, CLAP, GPT-2, the two RoBERTas, MiniLM, and the seven norm
# databases. Deselected by default so a bare `pytest` is runnable on a clean
# machine; run the full suite with `pytest -m ""`.
#
# Note this is deselection, not skipping: the tests are still there and still
# run for anyone with warm caches, which is the normal state on Ben's machine.
#
# --strict-markers so a mistyped `@pytest.mark.weigths` is a collection error
# rather than a mark that silently means nothing -- which would leave that test
# in the default suite without the weights it needs.
addopts = "-m 'not weights' --strict-markers"
markers = [
    "weights: downloads model weights or norm databases at test time (nltk punkt/cmudict do NOT count -- those are ~35 MB and the default suite needs them)",
]

[project.scripts]
word2psy = "word2psy.cli:main"

[project.urls]
Homepage = "https://github.com/hulacon/word2psy"
Repository = "https://github.com/hulacon/word2psy"
Issues = "https://github.com/hulacon/word2psy/issues"

[tool.setuptools.packages.find]
where = ["src"]
